# Spring application name
spring.application.name=SpringBootPractice

# Database configuration (PostgreSQL running in Docker)
spring.datasource.url=jdbc:postgresql://localhost:5332/Zach
spring.datasource.username=Zach
spring.datasource.password=${Database_Password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# JWT secret key used for token generation and validation
jwt.secret=${JWT_SECRET}